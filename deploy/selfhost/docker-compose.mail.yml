services:
  mail:
    image: docker-mailserver/docker-mailserver:15.0.2
    hostname: ${MAIL_HOSTNAME:?set MAIL_HOSTNAME in .env}
    restart: unless-stopped
    stop_grace_period: 1m
    environment:
      OVERRIDE_HOSTNAME: ${MAIL_HOSTNAME}
      SSL_TYPE: ${MAIL_SSL_TYPE:-self-signed}
      ENABLE_AMAVIS: "0"
      ENABLE_CLAMAV: "0"
      ENABLE_SPAMASSASSIN: "0"
      ENABLE_FAIL2BAN: "0"
      ENABLE_DNSBL: "0"
      ENABLE_POP3: "0"
      ENABLE_SRS: "0"
      PERMIT_DOCKER: none
      SPOOF_PROTECTION: "1"
      POSTFIX_INET_PROTOCOLS: ipv4
      TZ: ${MAIL_TZ:-Europe/Moscow}
    ports:
      - "${MAIL_BIND_IP:-127.0.0.1}:25:25"
      - "${MAIL_BIND_IP:-127.0.0.1}:465:465"
      - "${MAIL_BIND_IP:-127.0.0.1}:587:587"
      - "${MAIL_BIND_IP:-127.0.0.1}:993:993"
    volumes:
      - godcrm-mail-data:/var/mail
      - godcrm-mail-state:/var/mail-state
      - godcrm-mail-logs:/var/log/mail
      - godcrm-mail-config:/tmp/docker-mailserver

volumes:
  godcrm-mail-data:
  godcrm-mail-state:
  godcrm-mail-logs:
  godcrm-mail-config:
