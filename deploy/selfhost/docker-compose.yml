# GOD CRM — self-host stack.
#
#   docker compose up -d                                → CRM + Postgres, no memory
#   docker compose --profile memory-embedded  up -d     → + RCLL memory in the CRM's own Postgres
#   docker compose --profile memory-standalone up -d    → + RCLL memory in its own Postgres
#
# `install.sh` asks which of the three you want, writes MEMORY_MODE into .env
# and passes the matching profile. You can also run compose directly.
#
# EMBEDDED vs STANDALONE — same image, same migration lineage, same data model.
# The only difference is where the memory schema lives:
#
#   embedded    → schema ${MEMORY_SCHEMA} inside the CRM database.
#                 One database to back up, one to operate. Memory migrations are
#                 DDL against the CRM's database — that is why they are opt-out
#                 (MEMORY_RUN_MIGRATIONS) and why the schema is kept separate.
#   standalone  → its own `hindsight` database in its own container/volume.
#                 Two databases to back up; the CRM database is never touched
#                 by memory migrations.
#
# Enable exactly ONE memory profile. Both publish the same network alias
# (`hindsight`), so the CRM reaches memory at http://hindsight:5100 either way
# and HINDSIGHT_URL never has to change.

name: godcrm

# Config shared by both memory topologies. Everything that differs (database
# URL, schema, migrations) is set per-service below.
x-memory-common: &memory-common
  HINDSIGHT_API_HOST: "0.0.0.0"
  HINDSIGHT_API_PORT: "5100"
  # The LLM is used for memory classification on WRITE only — the read path
  # never calls a model. `none` is a supported provider: retain still works,
  # only classification quality degrades. A real provider with an EMPTY key is
  # a hard boot failure (ValueError → restart loop), so install.sh writes
  # `none` when no key is present.
  HINDSIGHT_API_LLM_PROVIDER: ${LLM_PROVIDER:-none}
  HINDSIGHT_API_LLM_API_KEY: ${LLM_API_KEY:-}
  HINDSIGHT_API_LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
  # Embeddings and reranker run locally on CPU — no key, no egress.
  HINDSIGHT_API_EMBEDDINGS_PROVIDER: local
  HINDSIGHT_API_EMBEDDINGS_LOCAL_FORCE_CPU: "true"
  HINDSIGHT_API_RERANKER_PROVIDER: local
  HINDSIGHT_API_RERANKER_LOCAL_FORCE_CPU: "true"
  HINDSIGHT_API_WORKERS: "1"

services:
  # ---- PostgreSQL: the CRM's own database ----
  # pgvector/pgvector:pg16 is stock Postgres 16 plus the `vector` extension.
  # It is the default for every mode so that turning memory on later never
  # requires swapping the image under an existing data volume.
  db:
    image: ${DB_IMAGE:-pgvector/pgvector:pg16}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-godcrm}
      POSTGRES_USER: ${POSTGRES_USER:-godcrm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - godcrm-db:/var/lib/postgresql/data
    # Not published to the host by default — the app reaches it over the
    # compose network. Uncomment to inspect from the host.
    # ports:
    #   - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-godcrm} -d ${POSTGRES_DB:-godcrm}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---- GOD CRM application (Express API + built React frontend) ----
  app:
    build:
      context: ../..
      dockerfile: deploy/selfhost/Dockerfile
    image: godcrm:selfhost
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      # Connection string → the app's pg adapter skips SSL for a local DB.
      POSTGRES_URL: postgresql://${POSTGRES_USER:-godcrm}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-godcrm}
      # Individual vars → used by the migration runner (run-migrations.mjs).
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-godcrm}
      POSTGRES_USER: ${POSTGRES_USER:-godcrm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_SSL: "false"
      # Secrets (generate with `openssl rand`; install.sh does this for you).
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      SESSION_SECRET: ${SESSION_SECRET:-}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      MASTER_ENCRYPTION_KEY: ${MASTER_ENCRYPTION_KEY:-}
      SECRETS_MASTER_KEY: ${SECRETS_MASTER_KEY:-}
      CRM_CREDENTIAL_KEY: ${CRM_CREDENTIAL_KEY:-}
      # Browser origin(s) allowed by CORS — set to how you reach the app.
      # Missing origins serve a white screen (CORS gates static assets).
      CORS_ORIGINS: ${PUBLIC_URL:-http://localhost:${APP_PORT:-5000}}
      UPLOAD_PATH: /app/uploads
      # Memory backend. Same alias in both topologies; unreachable (and unused)
      # when no memory profile is up.
      HINDSIGHT_URL: ${HINDSIGHT_URL:-http://hindsight:5100}
    ports:
      - "${APP_PORT:-5000}:5000"
    volumes:
      - godcrm-uploads:/app/uploads

  # ---- RCLL memory, EMBEDDED: `--profile memory-embedded` ----
  # Lives in schema ${MEMORY_SCHEMA} inside the CRM database. This is the
  # topology Ring 0 runs.
  memory-embedded:
    image: ${MEMORY_IMAGE:?set MEMORY_IMAGE in .env}
    profiles: ["memory-embedded"]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *memory-common
      HINDSIGHT_API_DATABASE_URL: postgresql://${POSTGRES_USER:-godcrm}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-godcrm}
      HINDSIGHT_API_MIGRATION_DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-godcrm}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-godcrm}
      # Own namespace inside the CRM database — never `public`.
      HINDSIGHT_API_DATABASE_SCHEMA: ${MEMORY_SCHEMA:-hindsight_v2}
      # Builds/upgrades the memory schema on start. A fresh install NEEDS this
      # once; afterwards it is DDL against your CRM database on every restart —
      # set MEMORY_RUN_MIGRATIONS=false in .env and run upgrades deliberately.
      # NOTE: the knob is *_ON_STARTUP. `HINDSIGHT_API_RUN_MIGRATIONS` (no
      # suffix) is read by nothing and the real default is ON — do not
      # "simplify" this back.
      HINDSIGHT_API_RUN_MIGRATIONS_ON_STARTUP: ${MEMORY_RUN_MIGRATIONS:-true}
    networks:
      default:
        aliases: [hindsight]

  # ---- RCLL memory, STANDALONE: `--profile memory-standalone` ----
  # Own database, own volume. The CRM database is never touched by memory DDL.
  memory-standalone:
    image: ${MEMORY_IMAGE:?set MEMORY_IMAGE in .env}
    profiles: ["memory-standalone"]
    restart: unless-stopped
    depends_on:
      memory-db:
        condition: service_healthy
    environment:
      <<: *memory-common
      HINDSIGHT_API_DATABASE_URL: postgresql://hindsight:${HINDSIGHT_DB_PASSWORD:?set HINDSIGHT_DB_PASSWORD in .env}@memory-db:5432/hindsight
      HINDSIGHT_API_MIGRATION_DATABASE_URL: postgresql+psycopg2://hindsight:${HINDSIGHT_DB_PASSWORD}@memory-db:5432/hindsight
      HINDSIGHT_API_DATABASE_SCHEMA: public
      HINDSIGHT_API_RUN_MIGRATIONS_ON_STARTUP: ${MEMORY_RUN_MIGRATIONS:-true}
    networks:
      default:
        aliases: [hindsight]

  memory-db:
    image: pgvector/pgvector:pg16
    profiles: ["memory-standalone"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: hindsight
      POSTGRES_USER: hindsight
      POSTGRES_PASSWORD: ${HINDSIGHT_DB_PASSWORD:?set HINDSIGHT_DB_PASSWORD in .env}
    volumes:
      - memory-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hindsight -d hindsight"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  godcrm-db:
  godcrm-uploads:
  memory-db:
