  <script type="application/ld+json">{"@context":"https://schema.org","@type":"SoftwareApplication","name":"GOD CRM","applicationCategory":"BusinessApplication","applicationSubCategory":"Substrate for LLM agents and business data","operatingSystem":"Web, self-hosted (Docker)","url":"https://godcrm.ai/","codeRepository":"https://godcrm.ai/git/holetron-lab/godcrm","description":"Self-hosted substrate between any LLM and your business: context, rights, memory, and the tools you build on top, with widgets or with code. Agents as first-class users. Bring your own model, keep your own data.","keywords":"self-hosted CRM, AI agents, MCP server, context rights memory, bring your own model, business substrate","isAccessibleForFree":true,"featureList":["Database-backed memory and state shared by several agents and a team, replacing markdown and Git files","Self-hosted CRM and operational database with native MCP; agents have their own accounts and permissions; no per-seat pricing","Roles, agent passports issued in one home space with access granted per space, project, table or column, human approval on dangerous tools, hash-chained audit log","Model-agnostic context and memory: switch between Claude, GPT and local models without losing business history","One workspace: tables, dashboards and documents in a UI for people, the same data over MCP and API for agents; widgets and code built in place"]}</script>
  <!-- FAQPage mirrors the #faq block on the landing (shared/landing-copy.json → faq.items); keep both in step. -->
  <script type="application/ld+json">{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"How do I move AI agent memory and state from markdown files and Git to a shared database for a team?","acceptedAnswer":{"@type":"Answer","text":"Keep the files for instructions; move state and memory into a database the agents share. In GOD CRM every agent is a user with its own passport, so writes are serialized, permissioned and logged instead of racing over the same folder. Memory is retained and recalled through MCP tools and survives model swaps. We ran our own ops from text files first and wrote down where it broke: godcrm.ai/blog/markdown-ops."}},{"@type":"Question","name":"Is there a self-hosted CRM or operational database built for AI agents with native MCP support?","acceptedAnswer":{"@type":"Answer","text":"GOD CRM is one: self-hosted, the whole system exposed as an MCP server, agents as first-class users with roles and scopes, no per-seat pricing. People get tables, dashboards and documents in a UI; agents get the same data over MCP and API. You can try the public read-only endpoint without an account: godcrm.ai/s/help/mcp."}},{"@type":"Question","name":"How do I give an LLM agent limited permissions to specific business tables, with approval and an audit log, instead of one all-or-nothing API key?","acceptedAnswer":{"@type":"Answer","text":"Give the agent a passport, not a key. In GOD CRM a passport is issued in one home space and bound to a human owner, access is granted per space, project, table or down to a column, the role decides what it can read or edit, approval rules pause dangerous tools until a human says yes, and every action lands in a hash-chained audit log. Five destructive tools are gated out of the box; the owner adds rules for anything else."}},{"@type":"Question","name":"How do I switch between Claude, GPT and local models without losing business context and agent memory?","acceptedAnswer":{"@type":"Answer","text":"Keep context, rights and memory outside the model. In GOD CRM they live in your database and are served to whichever model is plugged in; swapping the provider changes the provider and nothing else. We changed the model about ten times while running a real company on it, Claude, Grok, OpenAI models and others, with Gemini next, and the company did not notice: history, permissions and memory were never in the model to begin with."}},{"@type":"Question","name":"Is there a workspace where humans and AI agents work on the same tables and dashboards, not just an agent framework?","acceptedAnswer":{"@type":"Answer","text":"Yes. GOD CRM is not a framework you import. It is the place where humans and agents share tables, documents, dashboards and chat, with the same rights model for both. If you already have a framework or a tool, you can import it the other way round: connect it to your space (Notion, GitHub, Slack, Figma, any remote MCP server) and ask your agent to wire it in. We pulled our own Notion databases into tables this way. The \"and life\" in the header is literal: the tables are universal and the calendar is built in, so a training plan lives next to an invoice under the same rights and the same memory. A fitness module ships with it; nothing in the substrate assumes a company."}}]}</script>
